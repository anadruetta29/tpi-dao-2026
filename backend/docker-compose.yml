services:

  dao-db:
    image: postgres:17-alpine
    container_name: dao-db
    restart: no
    environment:
      POSTGRES_DB: dao
      POSTGRES_USER: develop
      POSTGRES_PASSWORD: develop
    volumes:
      - dao-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dao-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U develop -d dao"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "15m"
        max-file: "3"

networks:
  dao-dev-net:
    driver: bridge

volumes:
  dao-db-data:
