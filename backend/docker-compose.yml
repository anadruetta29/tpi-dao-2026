services:
  db:
    image: postgres:16-alpine
    container_name: library_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-develop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-develop}
      POSTGRES_DB: ${DB_NAME:-develop}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
